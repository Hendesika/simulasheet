<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SimulaSheet</title>
<!--
  The site's front door before launch.

  `privacy.html` has to be reachable from the day the first tester
  installs the app: the built AAB prints its address in the settings
  screen, and Play will not take a listing whose policy URL does not
  open. `index.html` does not — it is the marketing page, and it is the
  one thing on this domain worth copying (user decision, 2026-09-06).

  So `publish_site.sh --prelaunch` publishes the real policy and stands
  this in the front door instead: the name, the publisher, and the way
  through to the policy. Nothing about what the app does, no screens, no
  film, no feature list.

  On launch day, `publish_site.sh --stage-only` builds the full site and
  the real index.html takes this page's place. Nothing else moves — same
  repository, same branch, same two addresses.
-->
<style>
  :root {
    --ink: #0c1420;
    --paper: #e6eff7;
    --muted: #7a93a8;
    --accent: #4fc3f7;
  }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: var(--ink);
    color: var(--paper);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    /* The drawing grid the icon, the banner and the store tiles all use. */
    background-image:
      linear-gradient(to right, rgba(79,195,247,.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(79,195,247,.08) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  main { max-width: 34rem; text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .rule {
    width: 96px;
    height: 2px;
    margin: 20px auto;
    background: var(--accent);
    opacity: .85;
  }
  p { margin: 0 0 8px; color: var(--muted); }
  .publisher {
    margin-top: 28px;
    font-size: 13px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
  }
  a {
    display: inline-block;
    margin-top: 24px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(79,195,247,.4);
    padding-bottom: 2px;
  }
  a:hover { border-bottom-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>SimulaSheet</h1>
  <div class="rule"></div>
  <p>An Android app, in testing.</p>
  <p>This site opens when the app does.</p>
  <a href="privacy.html">Privacy policy</a>
  <div class="publisher">Hendesika</div>
</main>
</body>
</html>
